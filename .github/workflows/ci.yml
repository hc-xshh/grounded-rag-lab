name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -q
      - name: Evaluation harness must still hold its guarantees
        run: |
          python -m raglab eval --no-html --reports /tmp/reports --json > /tmp/metrics.json
          python - <<'PY'
          import json, pathlib, sys

          m = json.loads(pathlib.Path("/tmp/metrics.json").read_text())
          print(json.dumps(m, indent=2))
          # These are the properties the pipeline claims in the README. If a
          # change breaks one of them, CI must fail instead of quietly
          # shipping a weaker system.
          gates = {
              "invalid_citations": lambda v: v == 0,
              "spurious_refusals": lambda v: v == 0,
              "refusal_accuracy": lambda v: v >= 0.95,
              "retrieval_recall_at_k": lambda v: v >= 0.95,
              "fact_coverage": lambda v: v >= 0.95,
              "answer_support": lambda v: v >= 0.95,
          }
          failures = [k for k, ok in gates.items() if not ok(m.get(k, -1))]
          if failures:
              print("FAILED gates:", failures, file=sys.stderr)
              sys.exit(1)
          print("all quality gates passed")
          PY
